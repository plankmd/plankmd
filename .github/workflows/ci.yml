name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run validate

  # Commit messages follow CONTRIBUTING.md. Pull requests are squash-merged,
  # so their title is checked too.
  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pull request title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/check-commit-message.js --subject "$TITLE"
      - name: Commits
        run: node scripts/check-commit-message.js --range "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
