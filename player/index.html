<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PlankMD Player</title>
<style>
:root {
  --bg: #f6f3ee; --fg: #2a2620; --muted: #776f63; --panel: #fffdf9; --line: #e2dcd2;
  --accent: #8a5a1f; --err: #b03a2e; --warn: #9a6200; --ok: #2e7d4f; --info: #6a3fa0; --scene: #f3efe8;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1d1b18; --fg: #eee8de; --muted: #a59c8f; --panel: #262420; --line: #3a3630;
    --accent: #e0a75e; --err: #ec7b6e; --warn: #e3b25a; --ok: #7cc79a; --info: #c3a0ec; --scene: #262420;
  }
}
:root[data-theme="dark"] {
  --bg: #1d1b18; --fg: #eee8de; --muted: #a59c8f; --panel: #262420; --line: #3a3630;
  --accent: #e0a75e; --err: #ec7b6e; --warn: #e3b25a; --ok: #7cc79a; --info: #c3a0ec; --scene: #262420;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 system-ui, -apple-system, sans-serif; }
.app { display: grid; grid-template-columns: minmax(0, 420px) minmax(0, 1fr); gap: 16px; padding: 16px; height: 100vh; }
.side { display: flex; flex-direction: column; gap: 10px; min-height: 0; }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
h1 { font-size: 15px; margin: 0; }
h1 small { color: var(--muted); font-weight: 400; }
.row { display: flex; align-items: center; gap: 8px; }
select, button { font: inherit; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
button { cursor: pointer; }
button:hover { border-color: var(--accent); }
textarea { flex: 1; min-height: 220px; width: 100%; resize: vertical; font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
  background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
input[type=range] { flex: 1; accent-color: var(--accent); }
.label { width: 42px; color: var(--muted); }
html[lang="fr"] .label { width: 72px; }
.lang { display: inline-flex; }
.lang button { padding: 4px 6px; font-size: 12px; color: var(--muted); }
.lang button:first-child { border-radius: 6px 0 0 6px; }
.lang button:last-child { border-radius: 0 6px 6px 0; margin-left: -1px; }
.lang button[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); font-weight: 600; position: relative; }
.count { min-width: 56px; text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
#title { font-size: 18px; font-weight: 650; margin: 2px 0 0; }
#facts, #source { color: var(--muted); margin: 0; }
#description { margin: 0; }
#description:empty { display: none; }
#source a { color: var(--accent); overflow-wrap: anywhere; }
#step-title { font-weight: 600; margin: 0; }
#step-text { margin: 0; white-space: pre-line; }
#step-guides { margin: 0; color: #3f6fa8; font-size: 13px; }
#step-guides:empty { display: none; }
#diag { margin: 0; padding: 0; list-style: none; max-height: 160px; overflow: auto; font-size: 13px; }
#diag li { padding: 3px 0; border-top: 1px solid var(--line); }
#diag li[data-plank] { cursor: pointer; }
#diag li[data-plank]:hover { text-decoration: underline; }
.muted { color: var(--muted); }
.error { color: var(--err); } .warning { color: var(--warn); } .ok { color: var(--ok); } .info { color: var(--info); }
#balance, #step-balance { margin: 0; font-size: 13px; }
.toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; margin-top: 4px; }
#balance:empty, #step-balance:empty { display: none; }
#measure-row[hidden] { display: none; }
#sim-status { color: var(--muted); font-size: 13px; }
.sw.fall { border-color: #7b3fb0; background: repeating-linear-gradient(135deg, #7b3fb0 0 3px, transparent 3px 7px); }
.code { font-family: ui-monospace, monospace; font-size: 12px; }
#view { position: relative; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--scene); min-height: 320px; }
#view canvas { display: block; }
#drop-zone { position: absolute; inset: 0; display: none; place-items: center; background: color-mix(in srgb, var(--scene) 85%, transparent);
  border: 2px dashed var(--accent); border-radius: 8px; font-weight: 600; }
#view.dragging #drop-zone { display: grid; }
#hint { position: absolute; left: 10px; bottom: 8px; color: var(--muted); font-size: 12px; }
#legend { position: absolute; right: 10px; top: 8px; left: auto; max-width: calc(100% - 20px); display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: center; gap: 4px 10px; font-size: 12px; color: var(--muted);
  background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; }
#legend[hidden] { display: none; }
.sw { display: inline-block; width: 14px; height: 10px; border: 2px solid; margin-left: 4px; }
.sw.error { border-color: #c62828; background: repeating-linear-gradient(135deg, #c62828 0 3px, transparent 3px 7px); }
.sw.guide { border: 2px dashed #3f6fa8; background: rgba(63, 111, 168, 0.18); margin-left: 0; }
#legend > span { display: inline-flex; align-items: center; gap: 6px; }
#legend > span[hidden] { display: none; }
.sw.warning { border-color: #e08a00; background: repeating-linear-gradient(135deg, #e08a00 0 3px, transparent 3px 7px); }
footer { color: var(--muted); font-size: 12px; }
footer a { color: inherit; }
.links a + a { margin-left: 0.9em; }
@media (max-width: 820px) {
  .app { grid-template-columns: 1fr; height: auto; }
  #view { height: 60vh; order: -1; }
  textarea { min-height: 180px; }
}
</style>
</head>
<body>
<div class="app">
  <div class="side">
    <header>
      <h1>PlankMD <small data-i18n="player">player</small></h1>
      <div class="row">
        <select id="pick" aria-label="Sample" data-i18n-aria="sample"></select>
        <button id="open" title="Open a .plank.md file" data-i18n="open" data-i18n-title="openTitle">Open…</button>
        <input id="file" type="file" accept=".md,.plank.md,text/markdown" hidden>
        <span class="lang" role="group" aria-label="Language" data-i18n-aria="language" data-lang-switch><button data-lang="en" lang="en" aria-pressed="true">EN</button><button data-lang="fr" lang="fr" aria-pressed="false">FR</button></span>
      </div>
    </header>
    <div>
      <p id="title"></p>
      <p id="description"></p>
      <p id="facts"></p>
      <p id="source" hidden><span id="source-label"></span> <a id="source-link" target="_blank" rel="noopener"></a></p>
      <label class="toggle"><input type="checkbox" id="balance-on"> <span data-i18n="checkBalance">Check balance</span> <span class="muted" data-i18n="slow">(slow on big models)</span></label>
      <label class="toggle"><input type="checkbox" id="colours-on" checked> <span data-i18n="colours">Colours</span></label>
      <label class="toggle"><input type="checkbox" id="grain-on" checked> <span data-i18n="grain">Wood grain</span></label>
      <p id="balance"></p>
    </div>
    <div class="row"><span class="label" data-i18n="step">Step</span><input id="step" type="range" min="1" max="1" value="1" aria-label="Step" data-i18n-aria="step"><span class="count" id="stepn"></span></div>
    <div class="row"><span class="label" data-i18n="plank">Plank</span><button id="prev" aria-label="Previous plank" data-i18n-aria="prevPlank">‹</button><input id="pose" type="range" min="1" max="1" value="1" aria-label="Plank" data-i18n-aria="plank"><button id="next" aria-label="Next plank" data-i18n-aria="nextPlank">›</button><span class="count" id="posen"></span></div>
    <p id="step-title"></p>
    <p id="step-text"></p>
    <p id="step-guides"></p>
    <p id="step-balance"></p>
    <div class="row" id="measure-row" hidden><button id="measure-step" data-i18n="measureStep">Measure the tilt of this step</button></div>
    <div class="row"><button id="drop" title="Drop the planks shown in a physics engine, all at once" data-i18n="dropTest" data-i18n-title="dropTitle">Drop test</button><button id="replay" title="Place the planks one by one in a physics engine, in building order, up to the plank shown" data-i18n="replay" data-i18n-title="replayTitle">Replay build</button><button id="reset" hidden data-i18n="reset">Reset</button><span id="sim-status"></span></div>
    <ul id="diag"></ul>
    <textarea id="src" spellcheck="false" aria-label="PlankMD source" data-i18n-aria="source"></textarea>
    <footer><span data-i18n-html="footer">Drop a <span class="code">.plank.md</span> file on the scene, or edit the source. Drag to orbit, scroll to zoom.</span> <span class="links"><a href="booklet.html" id="to-booklet" target="_blank" data-i18n="booklet">Booklet (PDF)</a> <a href="video.html" id="to-video" target="_blank" data-i18n="video">Video</a> <a href="gallery.html" data-sibling="gallery.html" data-i18n="gallery">Gallery</a> <a href="../SPEC.md" data-i18n="spec">Spec</a> <a href="https://plankmd.org" data-i18n-href="site">plankmd.org</a></span></footer>
  </div>
  <div id="view"><div id="drop-zone" data-i18n="dropHere">Drop a .plank.md file</div><div id="hint"></div><div id="legend" hidden><span id="legend-guide"><span class="sw guide"></span><span data-i18n="legendGuide">guide, remove after use</span></span><span id="legend-problems"><span class="sw error"></span><span data-i18n="legendError">cannot be built</span> <span class="sw warning"></span><span data-i18n="legendFloating">rests on nothing</span></span><span id="legend-fall"><span class="sw fall"></span><span data-i18n="legendFall">would fall</span></span></div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="i18n.js"></script>
<script src="github.js"></script>
<script src="wood.js"></script>
<script src="../src/plankmd.js"></script>
<script src="../src/physics.js"></script>
<script src="../src/drop.js"></script>
<script src="samples.js"></script>
<script src="worker-src.js"></script>
<script>
'use strict';
const $ = (id) => document.getElementById(id);
const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

// ---------------------------------------------------------------- language
// The strings are in i18n.js. Texts that depend on the model are set with
// say(), which remembers how to write them again when the language changes.
const I18N = window.PlankMDI18n;
let lang = I18N.detect();
let T = I18N.strings(lang);
const num = (x, digits) => I18N.num(lang, x, digits);
const live = new Map();
function say(id, text, className) {
  const el = $(id);
  if (className !== undefined) el.className = className;
  live.set(el, text);
  el.textContent = text();
}
I18N.translatePage(lang);

// ------------------------------------------------------------------ scene
const view = $('view');
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(window.devicePixelRatio);
view.prepend(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 5000);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
let dirty = true; // the scene needs rendering (see the loop at the end)
controls.enableDamping = true;
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a7a66, 0.75));
const sun = new THREE.DirectionalLight(0xffffff, 0.6);
sun.position.set(40, 80, 50);
scene.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(4000, 4000), new THREE.MeshLambertMaterial({ color: 0xd9d2c5 }));
ground.rotation.x = -Math.PI / 2;
scene.add(ground);
let group = new THREE.Group();
scene.add(group);

function applyTheme() {
  dirty = true;
  scene.background = new THREE.Color(css('--scene'));
  ground.material.color.set(matchMedia('(prefers-color-scheme: dark)').matches ? 0x3a3630 : 0xd9d2c5);
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);

function resize() {
  const r = view.getBoundingClientRect();
  renderer.setSize(r.width, r.height);
  camera.aspect = r.width / r.height;
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(view);

// PlankMD is z-up with y going away from the viewer; three.js is y-up with z
// towards the viewer. (x, y, z) in PlankMD is (x, z, -y) in the scene.
// Diagonal stripes, like warning tape, for whatever cannot be built.
function hatch(color) {
  const c = document.createElement('canvas');
  c.width = c.height = 64;
  const g = c.getContext('2d');
  g.strokeStyle = color;
  g.lineWidth = 10;
  for (let i = -64; i <= 128; i += 24) { g.beginPath(); g.moveTo(i, 64); g.lineTo(i + 64, 0); g.stroke(); }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}
const PROBLEM = {
  error: { color: 0xc62828, css: '#c62828' },
  warning: { color: 0xe08a00, css: '#e08a00' },
  fall: { color: 0x7b3fb0, css: '#7b3fb0' },
};
for (const k in PROBLEM) PROBLEM[k].hatch = hatch(PROBLEM[k].css);

// A thick border made of twelve thin bars, since WebGL lines are always 1 px.
function border(sx, sy, sz, color, t) {
  const g = new THREE.Group();
  const m = new THREE.MeshBasicMaterial({ color });
  const bar = (w, h, d, x, y, z) => { const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); b.position.set(x, y, z); g.add(b); };
  const [hx, hy, hz] = [sx / 2, sz / 2, sy / 2]; // scene axes: x, y (up), z
  for (const a of [-1, 1]) for (const b of [-1, 1]) {
    bar(sx + t, t, t, 0, a * hy, b * hz);
    bar(t, sz + t, t, a * hx, 0, b * hz);
    bar(t, t, sy + t, a * hx, b * hy, 0);
  }
  return g;
}

function hatchedBox(sx, sy, sz, kind, opacity) {
  const tex = PROBLEM[kind].hatch.clone();
  tex.needsUpdate = true;
  tex.repeat.set(Math.max(1, Math.max(sx, sy) / 4), Math.max(1, sz / 4));
  const m = new THREE.MeshBasicMaterial({ map: tex, transparent: true, opacity, depthWrite: false, side: THREE.DoubleSide });
  return new THREE.Mesh(new THREE.BoxGeometry(sx + 0.08, sz + 0.08, sy + 0.08), m);
}

// PlankMD is z-up with y going away from the viewer; three.js is y-up with z
// towards the viewer. (x, y, z) in PlankMD is (x, z, -y) in the scene.
// Planks come in a handful of sizes and colours: share their geometry, edges
// and materials instead of building them again for every plank, every redraw.
// Ordinary planks are drawn in bulk (see addInstanced); only the current plank
// and planks with a problem get a mesh of their own.
const shared = new Map();
function cached(key, make) {
  if (!shared.has(key)) shared.set(key, make());
  return shared.get(key);
}
const EDGE_MATERIAL = new THREE.LineBasicMaterial({ color: 0x5a4630 });

// How planks look: their own colours or all natural wood, and a pine grain
// or plain colours. Both are remembered in this browser.
const LOOK_KEY = 'plankmd.look';
const look = { colours: true, grain: true };
try { Object.assign(look, JSON.parse(localStorage.getItem(LOOK_KEY) || '{}')); } catch { /* storage unavailable */ }
$('colours-on').checked = look.colours;
$('grain-on').checked = look.grain;
const colourOf = (p) => (look.colours ? p.color : PlankMDWood.WOOD);
function plankMaterial(color) {
  return new THREE.MeshLambertMaterial({ color, map: look.grain ? PlankMDWood.texture(THREE) : null });
}
const boxGeometry = (sx, sy, sz) => cached(`box:${sx},${sy},${sz}`, () => PlankMDWood.grainUVs(new THREE.BoxGeometry(sx, sz, sy)));
for (const id of ['colours-on', 'grain-on']) {
  $(id).addEventListener('change', () => {
    look.colours = $('colours-on').checked;
    look.grain = $('grain-on').checked;
    try { localStorage.setItem(LOOK_KEY, JSON.stringify(look)); } catch { /* storage unavailable */ }
    for (const key of [...shared.keys()]) if (key.startsWith('mat:')) shared.delete(key);
    if (state && !sim) draw();
  });
}

function meshFor(p, current, problem) {
  const [sx, sy, sz] = p.size;
  const geometry = boxGeometry(sx, sy, sz);
  // Materials are cloned only when a mesh changes its own (highlight, simulation).
  const color = colourOf(p);
  const material = current ? plankMaterial(color) : cached(`mat:${color}`, () => plankMaterial(color));
  const mesh = new THREE.Mesh(geometry, material);
  mesh.position.set(p.center[0], p.center[2], -p.center[1]);
  mesh.rotation.y = (p.rotation * Math.PI) / 180;
  if (problem) {
    mesh.add(border(sx, sy, sz, PROBLEM[problem].color, 0.28));
    mesh.add(hatchedBox(sx, sy, sz, problem, 0.55));
  } else {
    mesh.add(new THREE.LineSegments(cached(`edges:${sx},${sy},${sz}`, () => new THREE.EdgesGeometry(geometry)), EDGE_MATERIAL));
  }
  if (current) material.emissive = new THREE.Color(0x5a3500);
  return mesh;
}

// Where two planks share a volume: drawn as a solid striped block. Exact for
// planks turned by a multiple of 90°, which is almost every model.
function overlapVolume(p, q) {
  if (p.rotation % 90 || q.rotation % 90) return null;
  const box = (r) => {
    const xs = r.footprint.map((c) => c[0]), ys = r.footprint.map((c) => c[1]);
    return [[Math.min(...xs), Math.max(...xs)], [Math.min(...ys), Math.max(...ys)], [r.z0, r.z1]];
  };
  const a = box(p), b = box(q);
  const r = a.map(([a0, a1], i) => [Math.max(a0, b[i][0]), Math.min(a1, b[i][1])]);
  if (r.some(([lo, hi]) => hi <= lo)) return null;
  const [[x0, x1], [y0, y1], [z0, z1]] = r;
  const m = hatchedBox(x1 - x0, y1 - y0, z1 - z0, 'error', 0.95);
  m.material.depthTest = false;
  m.renderOrder = 2;
  m.position.set((x0 + x1) / 2, (z0 + z1) / 2, -(y0 + y1) / 2);
  return m;
}

// A guide: a ghost plank, translucent with a dashed outline, shown only
// during its own step. Red or orange when it reports a problem.
const GUIDE_COLOR = 0x3f6fa8;
function ghostFor(g, problem) {
  const [sx, sy, sz] = g.size;
  const geometry = new THREE.BoxGeometry(sx, sz, sy);
  const color = problem ? PROBLEM[problem].color : GUIDE_COLOR;
  const mesh = new THREE.Mesh(geometry, new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.18, depthWrite: false }));
  mesh.position.set(g.center[0], g.center[2], -g.center[1]);
  mesh.rotation.y = (g.rotation * Math.PI) / 180;
  const edges = new THREE.LineSegments(new THREE.EdgesGeometry(geometry), new THREE.LineDashedMaterial({ color, dashSize: 0.9, gapSize: 0.5 }));
  edges.computeLineDistances();
  mesh.add(edges);
  mesh.renderOrder = 1;
  return mesh;
}

// A dashed plumb line from a floating plank down to the ground.
function plumbLine(p) {
  const g = new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(p.center[0], p.z0, -p.center[1]), new THREE.Vector3(p.center[0], 0, -p.center[1])]);
  const line = new THREE.Line(g, new THREE.LineDashedMaterial({ color: PROBLEM.warning.color, dashSize: 0.8, gapSize: 0.6 }));
  line.computeLineDistances();
  return line;
}

// Draws many planks in a few calls: one instanced mesh per size and colour,
// and all their edges merged into a single line set. A model of 1000 planks
// then costs a handful of draw calls instead of 2000.
function addInstanced(target, planks) {
  const groups = new Map();
  for (const p of planks) {
    const key = `${p.size.join(',')}|${colourOf(p)}`;
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(p);
  }
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), up = new THREE.Vector3(0, 1, 0), one = new THREE.Vector3(1, 1, 1);
  const edgePositions = [];
  const v = new THREE.Vector3();
  for (const list of groups.values()) {
    const [sx, sy, sz] = list[0].size;
    const geometry = boxGeometry(sx, sy, sz);
    const color = colourOf(list[0]);
    const material = cached(`mat:${color}`, () => plankMaterial(color));
    const edges = cached(`edges:${sx},${sy},${sz}`, () => new THREE.EdgesGeometry(geometry)).attributes.position;
    const mesh = new THREE.InstancedMesh(geometry, material, list.length);
    list.forEach((p, i) => {
      q.setFromAxisAngle(up, (p.rotation * Math.PI) / 180);
      m.compose(new THREE.Vector3(p.center[0], p.center[2], -p.center[1]), q, one);
      mesh.setMatrixAt(i, m);
      for (let k = 0; k < edges.count; k++) {
        v.fromBufferAttribute(edges, k).applyMatrix4(m);
        edgePositions.push(v.x, v.y, v.z);
      }
    });
    mesh.instanceMatrix.needsUpdate = true;
    target.add(mesh);
  }
  if (edgePositions.length) {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(edgePositions, 3));
    target.add(new THREE.LineSegments(g, EDGE_MATERIAL));
  }
}

function frame() {
  if (!state || !state.planks.length) return;
  // Bounding box straight from the planks' footprints and heights (scene axes).
  const box = new THREE.Box3();
  for (const p of state.planks) {
    for (const [x, y] of p.footprint) { box.expandByPoint(new THREE.Vector3(x, p.z0, -y)); box.expandByPoint(new THREE.Vector3(x, p.z1, -y)); }
  }
  const center = box.getCenter(new THREE.Vector3());
  const radius = box.getSize(new THREE.Vector3()).length();
  controls.target.copy(center);
  camera.position.set(center.x + radius * 0.85, center.y + radius * 0.7, center.z + radius * 1.05);
  controls.update();
}

// ------------------------------------------------------------------ state
let state = null;
const pose = () => Number($('pose').value);
const lastOfStep = (k) => state.planks.filter((p) => p.step <= k).length || 1;

function draw() {
  dirty = true;
  stopSimulation();
  scene.remove(group);
  group = new THREE.Group();
  scene.add(group);
  if (!state) return;
  const n = pose();
  const current = state.planks[n - 1];
  const step = current ? current.step : 1;
  $('step').value = step;
  // Problems are shown once the plank they concern is on the table.
  const problems = new Map();
  const mark = (k, kind) => { if (k <= n && problems.get(k) !== 'error') problems.set(k, kind); };
  for (const d of state.diagnostics) {
    if (!d.plank || d.plank > n) continue;
    if (d.severity === 'error') { mark(d.plank, 'error'); if (d.other) mark(d.other, 'error'); }
    else if (d.code === 'W-floating') mark(d.plank, 'warning');
  }
  for (const d of state.diagnostics) if (d.code === 'E-guide-overlap' && d.step === step && d.other <= n) mark(d.other, 'error');
  // Balance: while the construction cannot stand, show the planks that give way.
  let falling = false;
  for (const d of balance ? balance.diagnostics : []) {
    if (d.code !== 'I-unstable' || n < d.plank || n > d.until) continue;
    falling = true;
    for (const k of d.failing) if (!problems.has(k)) problems.set(k, 'fall');
  }
  const plain = [];
  for (const p of state.planks) {
    if (p.n > n) continue;
    if (p.n === n || problems.has(p.n)) group.add(meshFor(p, p.n === n, problems.get(p.n)));
    else plain.push(p);
  }
  addInstanced(group, plain);
  const guides = state.guides.filter((g) => g.step === step);
  const guideProblem = new Map();
  for (const d of state.diagnostics) {
    if (!d.guide || d.step !== step) continue;
    for (const k of d.chain || [d.guide]) guideProblem.set(k, d.severity);
    if (d.code === 'E-guide-overlap' && d.other <= n) {
      mark(d.other, 'error');
      const v = overlapVolume(state.guides[d.guide - 1], state.planks[d.other - 1]);
      if (v) group.add(v);
    }
  }
  for (const g of guides) {
    group.add(ghostFor(g, guideProblem.get(g.g)));
  }
  for (const d of state.diagnostics) {
    if (!d.plank || d.plank > n) continue;
    if (d.code === 'E-overlap') { const v = overlapVolume(state.planks[d.plank - 1], state.planks[d.other - 1]); if (v) group.add(v); }
    if (d.code === 'W-floating') group.add(plumbLine(state.planks[d.plank - 1]));
  }
  $('legend').hidden = problems.size === 0 && guides.length === 0;
  $('legend-guide').hidden = guides.length === 0;
  $('legend-problems').hidden = ![...problems.values()].some((k) => k !== 'fall') && guideProblem.size === 0;
  $('legend-fall').hidden = !falling;
  $('posen').textContent = `${state.planks.length ? n : 0}/${state.planks.length}`;
  $('stepn').textContent = `${state.steps.length ? step : 0}/${state.steps.length}`;
  say('step-title', () => { const s = shown().steps[step - 1]; return s ? s.title : ''; });
  say('step-text', () => { const s = shown().steps[step - 1]; return s ? s.text : ''; });
  say('step-guides', () => (guides.length ? T.guidesInStep(guides.length) : ''));
  const sb = balance && balance.steps.find((x) => x.step === step);
  const measuring = balance && !balance.complete && !balance.skipped;
  const unmeasured = sb && sb.stands && sb.tilt === null;
  say('step-balance', () => (falling
    ? T.cannotStand(n)
    : sb ? (!sb.stands ? T.stepFalls : unmeasured ? (sb.measuring ? T.stepMeasuring : T.stepNotMeasured) : T.stepWithstands(num(sb.tilt, 1), sb.direction))
    : measuring ? T.stepMeasuring : ''), sb && (!sb.stands || (sb.tilt !== null && sb.tilt < PlankMDPhysics.FRAGILE_TILT)) ? 'info' : '');
  $('measure-row').hidden = !(unmeasured && !sb.measuring && !falling && balance.complete);
  say('hint', () => (current ? T.hint(current.n, current.line, current.id) : ''));
}

function describe(meta, planks) {
  const facts = [T.planks(planks.length)];
  if (planks.length) {
    const xs = planks.flatMap((p) => p.footprint.map((c) => c[0]));
    const ys = planks.flatMap((p) => p.footprint.map((c) => c[1]));
    const h = Math.max(...planks.map((p) => p.z1));
    const mm = meta.unit_mm || 7.8;
    const cm = (u) => (u * mm / 10).toFixed(0);
    facts.push(`${cm(Math.max(...xs) - Math.min(...xs))} × ${cm(Math.max(...ys) - Math.min(...ys))} × ${cm(h)} cm`);
  }
  if (meta.difficulty) facts.push(T.difficulty(meta.difficulty));
  if (meta.author) facts.push(T.by(meta.author));
  if (meta.license) facts.push(meta.license);
  const tr = shown().translation;
  if (tr) facts.push(T.translatedBy(tr.meta.author, tr.meta.license !== meta.license ? tr.meta.license : null));
  return facts.join(', ');
}

// The translations of the model shown, { <lang>: text }: the files named
// <name>.<lang>.plank.md next to it (docs/proposals/translations.md). The
// geometry always comes from the editor, the texts from the translation in
// the reader's language when there is one.
let translations = {};
let shownCache = null;
function shown() {
  const text = translations[lang];
  if (!text || state.meta.lang === lang) return state;
  if (!shownCache || shownCache.state !== state || shownCache.lang !== lang) {
    const translation = PlankMD.parse(text);
    shownCache = { state, lang, value: Object.assign(PlankMD.translate(state, translation), { translation }) };
  }
  return shownCache.value;
}

function run(keepPose) {
  const result = PlankMD.validate($('src').value);
  const wasAtEnd = state && pose() === state.planks.length;
  state = result;
  say('title', () => shown().meta.title || T.untitled);
  say('description', () => shown().description || '');
  say('facts', () => describe(result.meta, result.planks));
  $('step').max = Math.max(1, result.steps.length);
  $('pose').max = Math.max(1, result.planks.length);
  if (!keepPose || wasAtEnd || pose() > result.planks.length) $('pose').value = result.planks.length;

  balance = null;
  scheduleBalance(result);
  renderDiagnostics();
  draw();
}

let loadError = null; // a model that ?src= could not load: shown instead of the diagnostics
function renderDiagnostics() {
  const result = state;
  const list = $('diag');
  list.innerHTML = '';
  if (loadError) {
    const li = document.createElement('li');
    li.className = 'error';
    li.textContent = loadError();
    list.appendChild(li);
    return;
  }
  const all = result.diagnostics.concat(balance ? balance.diagnostics : []);
  const items = all.length ? all
    : [{ severity: 'ok', code: '', message: T.valid }];
  for (const d of items) {
    const li = document.createElement('li');
    li.className = d.severity;
    if (d.plank) li.dataset.plank = d.plank;
    li.innerHTML = d.code ? `<span class="code"></span> ` : '';
    if (d.code) li.firstChild.textContent = T.codeLine(d.code, d.line);
    li.append(document.createTextNode(d.code ? I18N.explain(d, lang).text : d.message));
    if (d.code && lang !== 'en') li.title = d.message; // the validator's own words, as the CLI prints them
    list.appendChild(li);
  }
}

// ---------------------------------------------------------------- balance
// The balance check (src/physics.js, solved by HiGHS) is off by default: it
// solves one linear program per plank placed and eight per step, which takes
// seconds on a small model and minutes on one of 200 planks. When it is on, it
// runs in a Web Worker so that the page stays responsive. The worker gets its
// sources from worker-src.js (a bundled string), since a worker cannot load
// local files when the page is opened from the disk.
const HIGHS_BASE = 'https://cdn.jsdelivr.net/npm/highs@1.15.3/build/';
const BALANCE_KEY = 'plankmd.balance';
let balance = null;
let balanceJob = 0;
let worker = null;

function balanceEnabled() { return $('balance-on').checked; }
try { $('balance-on').checked = localStorage.getItem(BALANCE_KEY) === 'on'; } catch { /* storage unavailable */ }

function startWorker() {
  const code = `importScripts(${JSON.stringify(HIGHS_BASE + 'highs.js')});
${window.PLANKMD_WORKER_SRC}
const ready = Module({ locateFile: (f) => ${JSON.stringify(HIGHS_BASE)} + f });
onmessage = async (e) => {
  const id = e.data.id;
  try {
    const highs = await ready;
    if (e.data.step) {
      postMessage({ id, measured: PlankMDPhysics.stepTilt(highs, PlankMD.validate(e.data.text), e.data.step) });
      return;
    }
    const analysis = PlankMDPhysics.analyse(highs, PlankMD.validate(e.data.text), {
      onProgress: (done, total) => postMessage({ id, progress: [done, total] }),
      onPartial: (partial) => postMessage({ id, partial }),
    });
    postMessage({ id, analysis });
  } catch (err) { postMessage({ id, error: String((err && err.message) || err) }); }
};`;
  const w = new Worker(URL.createObjectURL(new Blob([code], { type: 'text/javascript' })));
  w.onmessage = (e) => receiveBalance(e.data);
  w.onerror = (e) => { e.preventDefault(); receiveBalance({ id: balanceJob, error: 'the balance check could not start' }); };
  return w;
}

function stopBalance() {
  // A running check is useless once the model changed: stop it outright.
  if (worker && worker.busy) { worker.terminate(); worker = null; }
}

let balanceTimer = null;
function scheduleBalance(result) {
  const id = ++balanceJob;
  clearTimeout(balanceTimer);
  stopBalance();
  if (!balanceEnabled() || !result.planks.length) { say('balance', () => ''); return; }
  say('balance', () => T.balanceChecking(), 'muted');
  balanceTimer = setTimeout(() => {
    try { worker = worker || startWorker(); }
    catch { receiveBalance({ id, error: 'this browser cannot run it in the background' }); return; }
    worker.busy = true;
    worker.postMessage({ id, text: $('src').value });
  }, 400);
}

$('balance-on').addEventListener('change', () => {
  try { localStorage.setItem(BALANCE_KEY, balanceEnabled() ? 'on' : 'off'); } catch { /* storage unavailable */ }
  balance = null;
  if (state) { scheduleBalance(state); renderDiagnostics(); draw(); }
});

// The tilt of the step shown, on demand, when the check skipped it (big models).
$('measure-step').addEventListener('click', () => {
  const step = Number($('step').value);
  const sb = balance && balance.steps.find((x) => x.step === step);
  if (!sb || !worker) return;
  sb.measuring = true;
  worker.postMessage({ id: balanceJob, text: $('src').value, step });
  draw();
});

function receiveBalance({ id, analysis, error, progress, partial, measured }) {
  if (id !== balanceJob) return;
  if (measured !== undefined) {
    if (measured && balance) {
      const i = balance.steps.findIndex((x) => x.step === measured.step);
      if (i >= 0) balance.steps[i] = { step: measured.step, stands: measured.stands, tilt: measured.tilt, direction: measured.direction };
      balance.diagnostics = balance.diagnostics.concat(measured.diagnostics);
    }
    renderDiagnostics();
    if (!sim) draw();
    return;
  }
  if (progress) {
    // Before the first partial result, show the overall progress; after it,
    // the verdict is known and stays on screen while tilts are measured.
    if (!balance) say('balance', () => T.balanceChecking(Math.round((100 * progress[0]) / progress[1])));
    return;
  }
  if (partial) analysis = partial;
  else if (worker) worker.busy = false;
  if (error) { say('balance', () => T.balanceError(I18N.reason(error, lang)), 'warning'); return; }
  balance = analysis;
  if (analysis.skipped) say('balance', () => T.balanceSkipped(I18N.reason(analysis.skipped, lang)), 'muted');
  else if (!analysis.stable) {
    const first = analysis.diagnostics.find((d) => d.code === 'I-unstable');
    const until = first.until < state.planks.length ? first.until : null;
    say('balance', () => T.balanceFalls(first.plank, until), 'info');
  } else {
    const all = analysis.tilts === 'all';
    if (!analysis.complete) {
      const k = analysis.steps.length + 1, total = state.steps.length;
      say('balance', () => (all ? T.balanceMeasuring(k, total) : T.balanceMeasuringLast), 'ok');
    } else {
      const last = analysis.steps[analysis.steps.length - 1];
      const tilts = analysis.steps.filter((x) => x.tilt !== null).map((x) => x.tilt);
      const worst = Math.min(...tilts);
      if (!last || last.tilt === null) say('balance', () => '', '');
      else if (!all) say('balance', () => T.balanceStandsLast(num(last.tilt, 1)), last.tilt < PlankMDPhysics.FRAGILE_TILT ? 'info' : 'ok');
      else {
        say('balance', () => T.balanceStands(num(last.tilt, 1), worst < last.tilt - 0.05 ? num(worst, 1) : null),
          worst < PlankMDPhysics.FRAGILE_TILT ? 'info' : 'ok');
      }
    }
  }
  renderDiagnostics();
  // A drop test may be running: do not interrupt it, its scene is not the model's.
  if (!sim) draw();
}

// `pick` is the value of the model in the picker, when it is not a sample.
// `found` are its translations, when they do not come with the samples.
function load(text, name, pick, found) {
  loadError = null;
  translations = found || (!pick && sampleTranslations[name]) || {};
  $('pick').value = pick || (name in samples ? name : '');
  if (!pick) showSource(null);
  $('src').value = text;
  state = null;
  run(false);
  frame();
  setTitle(() => `${shown().meta.title || name || T.model} | ${T.pageTitle}`);
}

// -------------------------------------------------------------- drop test
// A physics engine (Rapier, https://rapier.rs, Apache-2.0) drops the planks
// shown and lets gravity act: see src/drop.js. The run is shown in slow
// motion, since the engine works at 1 u = 1 m (about 11 times slower than
// real planks).
const RAPIER_URL = 'https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.20.0/dist/rapier.mjs';
let rapier = null;
let sim = null;

async function loadRapier() {
  if (!rapier) {
    const mod = await import(RAPIER_URL);
    rapier = mod.default || mod;
    await rapier.init();
  }
  return rapier;
}

function stopSimulation() {
  if (!sim) return;
  sim.stopped = true;
  scene.remove(sim.group);
  sim.drop.free();
  sim = null;
  group.visible = true;
  $('reset').hidden = true;
  say('sim-status', () => '', '');
}

const REPLAY_SPEED = 3; // a replay is long: play it three times faster than the drop test

async function dropTest(replay) {
  if (!state || !state.planks.length) return;
  $('drop').disabled = $('replay').disabled = true;
  say('sim-status', () => T.simLoading, '');
  let R;
  try { R = await loadRapier(); }
  catch (err) { say('sim-status', () => T.simLoadFailed(err.message)); $('drop').disabled = $('replay').disabled = false; return; }
  draw(); // start from the model as shown, and stop any previous run
  const planks = state.planks.filter((p) => p.n <= pose());
  const drop = PlankMDDrop.createDrop(R, planks, { replay: !!replay });
  const meshes = new Map();
  const simGroup = new THREE.Group();
  for (const p of planks) { const m = meshFor(p, false, null); m.visible = !replay; meshes.set(p.n, m); simGroup.add(m); }
  group.visible = false;
  scene.add(simGroup);
  const run = { drop, group: simGroup, stopped: false };
  sim = run;
  $('reset').hidden = false;
  let last = performance.now();
  await new Promise((resolve) => {
    (function frameStep(now) {
      if (run.stopped) return resolve();
      // Real time (faster for a replay), at most 1/10 s of simulated time per frame.
      const speed = replay ? REPLAY_SPEED : 1;
      drop.advance(Math.min(speed / 30, (speed * ((now || performance.now()) - last)) / 1000));
      last = now || performance.now();
      for (const { n, position, quaternion } of drop.poses()) {
        const m = meshes.get(n);
        m.position.set(...position);
        m.quaternion.set(...quaternion);
        m.visible = true;
      }
      const placed = drop.placed, time = drop.time;
      say('sim-status', () => (replay && placed < planks.length ? T.simPlacing(placed, planks.length) : T.simRunning(num(time, 1))));
      if (drop.done) return resolve();
      requestAnimationFrame(frameStep);
    })();
  });
  $('drop').disabled = $('replay').disabled = false;
  if (run.stopped) return;
  const result = drop.result();
  for (const m of result.moved) {
    const mesh = meshes.get(m.n);
    mesh.material = mesh.material.clone(); // materials are shared between planks
    mesh.material.emissive = new THREE.Color(0x7b3fb0);
  }
  const mm = state.meta.unit_mm || 7.8;
  if (replay && result.fellAt) {
    say('sim-status', () => T.simFellBuild(result.fellAt.n, result.moved.length), 'info');
  } else if (result.stood) {
    say('sim-status', () => (replay ? T.simStoodBuild(planks.length) : T.simStood), 'ok');
  } else {
    const worst = result.moved.reduce((a, b) => (b.distance > a.distance ? b : a));
    say('sim-status', () => T.simFell(result.moved.length, num((worst.distance * mm) / 10, 1), worst.n), 'info');
  }
}
$('drop').addEventListener('click', () => dropTest(false));
$('replay').addEventListener('click', () => dropTest(true));
$('reset').addEventListener('click', () => { draw(); });

// ------------------------------------------------------------------ input
const samples = window.PLANKMD_SAMPLES || {};
const sampleTranslations = window.PLANKMD_TRANSLATIONS || {};
for (const name of Object.keys(samples)) $('pick').add(new Option(name, name));
$('pick').addEventListener('change', () => {
  const value = $('pick').value;
  if (github.files.has(value)) openGitHubFile(github.files.get(value));
  else load(samples[value], value);
});

let timer = null;
$('src').addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(() => run(true), 150); });
$('step').addEventListener('input', () => { $('pose').value = lastOfStep(Number($('step').value)); draw(); });
$('pose').addEventListener('input', draw);
$('prev').addEventListener('click', () => { $('pose').value = Math.max(1, pose() - 1); draw(); });
$('next').addEventListener('click', () => { $('pose').value = Math.min(state.planks.length, pose() + 1); draw(); });
$('diag').addEventListener('click', (e) => {
  const li = e.target.closest('li[data-plank]');
  if (li) { $('pose').value = li.dataset.plank; draw(); }
});
document.addEventListener('keydown', (e) => {
  if (e.target === $('src')) return;
  if (e.key === 'ArrowRight') $('next').click();
  if (e.key === 'ArrowLeft') $('prev').click();
});

function readFile(file) {
  file.text().then((text) => load(text, file.name));
}
$('open').addEventListener('click', () => $('file').click());
$('file').addEventListener('change', () => { if ($('file').files[0]) readFile($('file').files[0]); });
view.addEventListener('dragover', (e) => { e.preventDefault(); view.classList.add('dragging'); });
view.addEventListener('dragleave', () => view.classList.remove('dragging'));
view.addEventListener('drop', (e) => {
  e.preventDefault();
  view.classList.remove('dragging');
  if (e.dataTransfer.files[0]) readFile(e.dataTransfer.files[0]);
});

// The EN/FR switch: write every text again in the other language.
let titleText = () => T.pageTitle;
function setTitle(text) { titleText = text; document.title = text(); }
I18N.onSwitch((next) => {
  lang = next;
  T = I18N.strings(lang);
  I18N.translatePage(lang);
  for (const [el, text] of live) el.textContent = text();
  document.title = titleText();
  if (state || loadError) renderDiagnostics();
});
setTitle(titleText);

// ?src=<url> loads a model from the web; #<sample> picks a bundled sample.
applyTheme();
resize();
const srcUrl = new URLSearchParams(location.search).get('src');
// #code=<base64url of the UTF-8 text> opens a model given in the link itself:
// the examples on plankmd.org link to the player this way.
const codeParam = location.hash.startsWith('#code=') ? location.hash.slice(6) : null;
let codeText = null;
if (codeParam) {
  try {
    const b64 = codeParam.replace(/-/g, '+').replace(/_/g, '/');
    codeText = new TextDecoder().decode(Uint8Array.from(atob(b64), (c) => c.charCodeAt(0)));
  } catch { codeText = null; }
}
const first = location.hash.slice(1) in samples ? location.hash.slice(1) : Object.keys(samples)[0];
if (codeText !== null) load(codeText, 'example.plank.md');
else if (first) { $('pick').value = first; load(samples[first], first); }
if (srcUrl) {
  fetch(srcUrl).then((r) => (r.ok ? r.text() : Promise.reject(new Error(`HTTP ${r.status}`))))
    .then((text) => load(text, srcUrl.split('/').pop()))
    .catch((err) => { loadError = () => T.loadFailed(srcUrl, err.message); renderDiagnostics(); });
}

// The booklet and the video of the model shown, as it is in the editor.
function openWith(page, e) {
  e.preventDefault();
  const bytes = new TextEncoder().encode($('src').value);
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
  const code = btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  window.open(`${page}?lang=${lang}#code=${code}`, '_blank', 'noopener');
}
$('to-booklet').addEventListener('click', (e) => openWith('booklet.html', e));
$('to-video').addEventListener('click', (e) => openWith('video.html', e));

// ---------------------------------------------------------------- GitHub
// ?github=<address> (or ?repo=) opens the models of a GitHub repository,
// folder, file or gist, straight from GitHub (see github.js): they are added
// to the picker, and &file=<path> picks one. Nothing goes through a server.
const GH = window.PlankMDGitHub;
const github = { spec: null, files: new Map(), translations: new Map() };

function showSource(file) {
  $('source').hidden = !file;
  if (!file) return;
  say('source-label', () => T.githubFrom);
  const link = $('source-link');
  link.textContent = github.spec.kind === 'gist' ? `${GH.label(github.spec)}: ${file.path}` : `${github.spec.owner}/${github.spec.repo}/${file.path}`;
  link.href = github.spec.kind === 'gist' ? GH.htmlUrl(github.spec) : GH.htmlUrl({ ...github.spec, kind: 'file', path: file.path });
}

function githubError(err) {
  const where = GH.label(github.spec);
  const detail = err.reason === 'rate-limit' && err.reset ? err.reset.toLocaleTimeString(lang, { hour: '2-digit', minute: '2-digit' }) : err.message;
  loadError = () => T.githubFailed(where, T.githubWhy(err.reason, detail));
  showSource(null);
  renderDiagnostics();
}

async function openGitHubFile(file) {
  $('source').hidden = false;
  say('source-label', () => T.githubLoading(GH.label(github.spec)));
  $('source-link').textContent = '';
  let text;
  try { text = await GH.text(file); } catch (err) { githubError(err); return; }
  const found = {};
  await Promise.all(Object.entries(github.translations.get(file.path) || {}).map(async ([code, f]) => {
    try { found[code] = await GH.text(f); } catch { /* the model still reads in its own language */ }
  }));
  load(text, file.name, `gh:${file.path}`, found);
  showSource(file);
  // Keep the address shareable: it names the model shown.
  const params = new URLSearchParams(location.search);
  if (github.files.size > 1) params.set('file', file.path); else params.delete('file');
  try { history.replaceState(null, '', `${location.pathname}?${params}`); } catch { /* file:// in some browsers */ }
}

async function loadGitHub(address) {
  github.spec = GH.parse(address);
  if (!github.spec) {
    loadError = () => T.githubBadAddress(address);
    renderDiagnostics();
    return;
  }
  $('source').hidden = false;
  say('source-label', () => T.githubLoading(GH.label(github.spec)));
  let files;
  try { files = await GH.cachedList(github.spec); } catch (err) { githubError(err); return; }
  ({ models: files, translations: github.translations } = GH.translations(files));
  const group = document.createElement('optgroup');
  group.label = T.githubGroup(GH.label(github.spec));
  for (const f of files) {
    github.files.set(`gh:${f.path}`, f);
    group.appendChild(new Option(f.path, `gh:${f.path}`));
  }
  $('pick').insertBefore(group, $('pick').firstChild);
  const wanted = new URLSearchParams(location.search).get('file');
  await openGitHubFile(files.find((f) => f.path === wanted) || files[0]);
}
const githubAddress = GH.fromSearch(location.search);
if (githubAddress) loadGitHub(githubAddress);

// Render only when something changed: the camera moved, the model was
// redrawn, or a simulation is running. An idle page then costs nothing.
const invalidate = () => { dirty = true; };
controls.addEventListener('change', invalidate);
new ResizeObserver(invalidate).observe(view);
(function loop() {
  requestAnimationFrame(loop);
  controls.update(); // keeps damping going; fires 'change' while the camera moves
  if (dirty || sim) { renderer.render(scene, camera); dirty = false; }
})();
</script>
</body>
</html>
